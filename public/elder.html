<!doctype html>
<html lang="en" data-size="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffcf8a">
  <title>SamiMeds – My medicines</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/elder.css">
  <script type="module" src="/js/elder.js"></script>
</head>
<body class="elder">
  <a class="skip-link" href="#panels">Skip to main content</a>

  <header class="hero" id="hero">
    <div class="hero-scene" aria-hidden="true"><span class="orb"></span><span class="hill h1"></span><span class="hill h2"></span></div>
    <div class="hero-row">
      <div>
        <p class="hello" id="hello">Hello</p>
        <p class="today" id="today-label"></p>
      </div>
      <div class="hero-actions">
        <button class="round-btn" type="button" id="size-btn" aria-label="Make text bigger">A<span>+</span></button>
        <button class="round-btn" type="button" id="speak-all" aria-label="Read this screen aloud">🔊</button>
      </div>
    </div>
  </header>

  <main id="panels" tabindex="-1">
    <section id="panel-now" role="tabpanel" aria-labelledby="tab-now" class="panel"><div class="spinner" role="progressbar" aria-label="Loading"></div></section>
    <section id="panel-visits" role="tabpanel" aria-labelledby="tab-visits" class="panel" hidden></section>
    <section id="panel-day" role="tabpanel" aria-labelledby="tab-day" class="panel" hidden></section>
    <section id="panel-help" role="tabpanel" aria-labelledby="tab-help" class="panel" hidden></section>
  </main>

  <nav class="bottom-tabs" aria-label="Sections">
    <div role="tablist" aria-label="Sections" id="tablist">
      <button role="tab" id="tab-now" aria-controls="panel-now" data-tab="now" type="button"><span aria-hidden="true">💊</span>Medicines</button>
      <button role="tab" id="tab-visits" aria-controls="panel-visits" data-tab="visits" type="button"><span aria-hidden="true">🩺</span>Doctor</button>
      <button role="tab" id="tab-day" aria-controls="panel-day" data-tab="day" type="button"><span aria-hidden="true">🌼</span>My day</button>
      <button role="tab" id="tab-help" aria-controls="panel-help" data-tab="help" type="button"><span aria-hidden="true">📞</span>Help</button>
    </div>
  </nav>
</body>
</html>
